name: Check upstream drift

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # GitHub cron is UTC: Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the clean upstream mirror
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compare fork mirror with upstream
        id: compare
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/54yyyu/zotero-mcp.git
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

          mirror_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse upstream/main)
          echo "mirror_sha=$mirror_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [[ "$mirror_sha" == "$upstream_sha" ]]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "Fork main is current with upstream main."
          elif git merge-base --is-ancestor "$mirror_sha" "$upstream_sha"; then
            echo "status=behind" >> "$GITHUB_OUTPUT"
            echo "Fork main is behind upstream main."
          else
            echo "status=diverged" >> "$GITHUB_OUTPUT"
            echo "Fork main and upstream main have diverged."
          fi

      - name: Update the single upstream-sync branch
        id: branch
        if: steps.compare.outputs.status == 'behind'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          branch=automation/upstream-sync
          existing_sha=""
          if git fetch origin "$branch" 2>/dev/null; then
            existing_sha=$(git rev-parse "origin/$branch" 2>/dev/null || true)
          fi

          if [[ "$existing_sha" == "$UPSTREAM_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The existing upstream-sync branch is already current."
            exit 0
          fi

          git switch -C "$branch" upstream/main
          git push --force-with-lease origin "$branch:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Updated $branch to $UPSTREAM_SHA."

      - name: Open or update the draft sync pull request
        if: steps.compare.outputs.status == 'behind'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_SHA: ${{ steps.compare.outputs.mirror_sha }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
          BRANCH_CHANGED: ${{ steps.branch.outputs.changed }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          head="$GITHUB_REPOSITORY_OWNER:automation/upstream-sync"
          title="Upstream sync: ${UPSTREAM_SHA:0:7}"
          body=$(cat <<EOF
          This draft PR is generated by the weekly upstream-drift check.

          It advances the fork's clean main mirror from ${MIRROR_SHA:0:12} to upstream ${UPSTREAM_SHA:0:12}.

          This PR is intentionally not merged automatically. After review:

          1. Merge it into main only if the upstream changes are acceptable.
          2. Merge or rebase main into samuel manually.
          3. Run the full test suite and inspect behavior against Samuel's customizations.
          4. Create a new tested fork tag before changing the pinned installation.

          The live installation remains pinned to its existing tested tag.
          EOF
          )

          pr_number=$(gh pr list \
            --repo "$repo" \
            --state open \
            --base main \
            --head "$head" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$pr_number" ]]; then
            if [[ "$BRANCH_CHANGED" == "true" ]]; then
              gh pr comment "$pr_number" --repo "$repo" \
                --body "The upstream-sync branch was updated to upstream ${UPSTREAM_SHA:0:12}. This PR still requires manual review; nothing was merged or deployed."
            else
              echo "Existing draft PR #$pr_number is already current."
            fi
          else
            gh pr create \
              --repo "$repo" \
              --base main \
              --head "$head" \
              --draft \
              --title "$title" \
              --body "$body"
          fi

      - name: Trigger CI for a changed sync branch
        if: steps.compare.outputs.status == 'behind' && steps.branch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref automation/upstream-sync

      - name: Open a manual-resolution issue for divergent history
        if: steps.compare.outputs.status == 'diverged'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_SHA: ${{ steps.compare.outputs.mirror_sha }}
          UPSTREAM_SHA: ${{ steps.compare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          title="Manual upstream sync required"
          existing=$(gh issue list \
            --repo "$repo" \
            --state open \
            --search "in:title $title" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Existing manual-resolution issue #$existing is still open."
            exit 0
          fi

          gh issue create \
            --repo "$repo" \
            --title "$title" \
            --body "The clean fork main (${MIRROR_SHA:0:12}) and upstream main (${UPSTREAM_SHA:0:12}) no longer have a fast-forward relationship. Resolve this manually; the scheduled check will not merge, rebase, or deploy changes."

      - name: Report no upstream drift
        if: steps.compare.outputs.status == 'clean'
        run: echo "No upstream drift detected."
